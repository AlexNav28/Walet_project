; PlatformIO Project Configuration File
;
; FPC2534 Fingerprint Sensor Test Project
; Board: Adafruit Feather ESP32-S3
; Communication: UART (TX=17, RX=18, IRQ=16) via ZIF connector

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino

; Use the USB CDC for Serial Monitor output
monitor_speed = 115200

; Increase upload speed for faster flashing
upload_speed = 921600

