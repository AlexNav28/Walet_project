; PlatformIO Project Configuration File
;
; FPC2534 Fingerprint Sensor Test Project
; Board: Adafruit Feather ESP32-S3
; Communication: UART (Serial1 at 921600 baud)

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino

; Use the USB CDC for Serial Monitor output
monitor_speed = 115200

; Increase upload speed for faster flashing
upload_speed = 921600

; Enable USB CDC on boot so Serial works over USB-C
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
