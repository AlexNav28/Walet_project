; ============================================================================
;  Smart Wallet - PlatformIO project configuration
;
;  Board: Adafruit Feather ESP32-S3 profile, used for the custom
;         ESP32-S3-MINI-1 PCB (same SoC, same flash/PSRAM layout).
;
;  One environment per flashable image. The firmware env builds everything in
;  src/; every test env builds exactly one sketch out of test/ instead, using
;  build_src_filter. That way each driver can be flashed and proven in
;  isolation, and the integration build is a single command as well.
;
;      pio run                                            builds the firmware
;      pio run -e wallet_firmware -t upload -t monitor    flash and watch it
;      pio run -e test_fingerprint_uart -t upload         flash one unit test
;      pio run -e test_imu_i2c -e test_servo_lock ...     build several at once
;
;  Every environment listed below compiles clean with -Wall.
;
;  See test/README.md for what each test proves.
; ============================================================================

[platformio]
default_envs = wallet_firmware

; ----------------------------------------------------------------------------
; Settings shared by every image.
; ----------------------------------------------------------------------------
[common]
; Pinned deliberately. This project uses Arduino-ESP32 core 2.x APIs
; (ledcSetup/ledcAttachPin, BLECharacteristic::getValue() returning
; std::string), both of which were removed in core 3.x. Leaving the platform
; floating means this repository stops building for anyone who clones it after
; the next platform release - which, for a repository whose point is that
; someone else can read and build it, is a defect.
platform = espressif32 @ 7.0.1
board = adafruit_feather_esp32s3
framework = arduino

; The USB CDC console runs at the same rate as the sensor link so both can be
; watched with one terminal setting.
monitor_speed = 921600
upload_speed = 921600

monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

; ----------------------------------------------------------------------------
; Full firmware - everything in src/, the image the wallet ships with.
; ----------------------------------------------------------------------------
[env:wallet_firmware]
extends = common
build_src_filter = +<*>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

; ----------------------------------------------------------------------------
; Unit tests - one peripheral each, no RTOS, no other drivers in the way.
; ----------------------------------------------------------------------------

; FPC2534 over UART: enrol, delete, validate. The hard one.
[env:test_fingerprint_uart]
extends = common
build_src_filter = -<*> +<../test/unit/fingerprint_uart/>

; Serial1 jumper loopback: proves the MCU side before blaming the sensor.
[env:test_uart_loopback]
extends = common
monitor_speed = 115200
build_src_filter = -<*> +<../test/unit/uart_loopback/>

; LSM6DSO over I2C: WHO_AM_I, block read, and threshold characterisation.
[env:test_imu_i2c]
extends = common
monitor_speed = 115200
build_src_filter = -<*> +<../test/unit/imu_i2c/>

; Servo latch on the repurposed buzzer GPIO: end-stop discovery.
[env:test_servo_lock]
extends = common
monitor_speed = 115200
build_src_filter = -<*> +<../test/unit/servo_lock/>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5

; Buzzer through its N-MOS. Historical: that N-MOS was removed during rework.
[env:test_buzzer]
extends = common
monitor_speed = 115200
build_src_filter = -<*> +<../test/unit/buzzer/>

; BLE GATT service on its own, for developing the phone side.
[env:test_ble_link]
extends = common
monitor_speed = 115200
build_src_filter = -<*> +<../test/unit/ble_link/>

; ----------------------------------------------------------------------------
; Integration test - all board drivers together under FreeRTOS, no radios.
; ----------------------------------------------------------------------------
[env:test_full_system]
extends = common
build_src_filter = -<*> +<../test/integration/full_system_rtos/>
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
